<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具箱</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        
        /* 左侧侧边栏 */
        .sidebar {
            width: 220px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sidebar-title {
            padding: 0 20px 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #3e5871;
            margin-bottom: 10px;
            color: #ecf0f1;
        }

        .tab-btn {
            padding: 15px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: #bdc3c7;
            text-align: left;
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
        }

        .tab-btn:hover { background: #34495e; color: white; }
        .tab-btn.active { background: #3498db; color: white; font-weight: bold; }

        /* 右侧内容区 */
        .content { flex: 1; background: #f9f9f9; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">Sheet1 工具箱</div>
        <button class="tab-btn active" onclick="loadPage('invoice.html', this)">发票工具</button>
        <button class="tab-btn" onclick="loadPage('offer.html', this)">报价工具</button>
        <button class="tab-btn" onclick="loadPage('quote.html', this)">核价工具</button>
    </div>

    <div class="content">
        <iframe id="mainFrame" src="invoice.html"></iframe>
    </div>

    <script>
        function loadPage(pageUrl, element) {
            const frame = document.getElementById('mainFrame');
            
            // 1. 更新 iframe 地址
            frame.src = pageUrl;

            // 2. 更新按钮高亮
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // 3. 调试日志（如果还没反应，按 F12 看控制台）
            console.log("正在切换到:", pageUrl);
        }

        // 容错处理：如果 iframe 加载失败
        document.getElementById('mainFrame').onerror = function() {
            alert("无法加载页面，请检查文件名是否正确。");
        };
    </script>
</body>
</html>
